# ============================================
# Neo4j 图数据库 - Docker Compose
#
# 部署路径: /data/shilianjia/rag-test/
#
# Java 说明：
#   使用 Neo4j Docker 镜像内置的 Java (eclipse-temurin:17-jre)
#   路径: /opt/java/openjdk
#   无需在宿主机安装 Java，不影响宿主机环境
#
# 使用方式：
#   启动：  docker compose up -d
#   日志：  docker compose logs -f
#   停止：  docker compose down
#   重启：  docker compose restart
#
# 访问地址：
#   HTTP:  http://114.115.255.226:51001
#   Bolt:  bolt://114.115.255.226:7687
#   账户:  neo4j / slj@neo4j
# ============================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: child-dev-backend
    user: "0:0"
    restart: unless-stopped
    mem_limit: 4g
    cpus: 3
    pids_limit: 4096
    shm_size: "1g"
    security_opt:
      - seccomp:unconfined
    ports:
      - "${APP_PORT:-51002}:51002"
    env_file: ${ENV_FILE:-backend/.env.test}
    environment:
      # 容器内路径映射和运行时必要参数，其余全部由 env_file 提供
      APP_HOST: "0.0.0.0"
      APP_PORT: "51002"
      APP_RELOAD: "False"
      DATA_DIR: "/app/app_data/data"
      RAG_STORAGE_DIR: "/app/app_data/storage"
      RAG_TEMP_UPLOAD_DIR: "/app/app_data/temp_uploads"
      LOG_FILE: "/app/backend/logs/app.log"
      # 以下变量本应由 Dockerfile ENV 设置，部分环境下镜像 ENV 丢失，此处显式补充
      PATH: "/app/backend/.venv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      PYTHONPATH: "/app/backend"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # 限制 ML 库线程数，减少容器内线程创建压力
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - /data/shilianjia/rag-test/app_data:/app/app_data
      - /data/shilianjia/rag-test/logs:/app/backend/logs
    command: ["/app/backend/.venv/bin/uvicorn", "src.server:create_app", "--host", "0.0.0.0", "--port", "51002", "--factory"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:51002/health/')"]
      interval: 30s
      timeout: 10s
      start_period: 900s
      retries: 3

  neo4j:
    image: neo4j:5.26-community
    container_name: child-dev-neo4j
    restart: unless-stopped
    mem_limit: 2g
    ports:
      - "51003:7474"
      - "51004:7687"
    environment:
      NEO4J_AUTH: "neo4j/slj@neo4j"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_server_default__listen__address: "0.0.0.0"
    volumes:
      - /data/shilianjia/rag-test/neo4j/data:/data
      - /data/shilianjia/rag-test/neo4j/logs:/logs
      - /data/shilianjia/rag-test/neo4j/import:/var/lib/neo4j/import
      - /data/shilianjia/rag-test/neo4j/plugins:/plugins
    security_opt: # 新增
      - seccomp:unconfined     # 禁用 seccomp 限制
      # - apparmor:unconfined  # 如果宿主机使用 AppArmor（Ubuntu/Debian）则取消注释，CentOS/RHEL 不需要
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "neo4j", "-p", "slj@neo4j", "RETURN 1;" ]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5

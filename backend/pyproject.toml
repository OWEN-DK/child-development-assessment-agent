[project]
name = "child-development-assessment-agent"
version = "0.1.0"
description = "Child Development Assessment Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn>=0.29.0",
    "langgraph==1.1.0",
    "langchain==1.2.11",
    "llama-index==0.14.16",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-vector-stores-pinecone>=0.2.0",
    "llama-index-vector-stores-milvus>=0.2.0",
    "llama-index-vector-stores-weaviate>=0.2.0",
    "pydantic==2.12.5",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "ebooklib>=0.20",
    "html2text>=2025.4.15",
    "pymupdf>=1.27.2",
    "beautifulsoup4>=4.14.3",
    "pytest-asyncio>=1.3.0",
    "llama-index-retrievers-bm25>=0.2.3",
    "llama-index-llms-dashscope>=0.2.1",
    "llama-index-embeddings-dashscope>=0.2.1",
    "jieba>=0.42.1",
    "xgboost>=3.2.0",
    "shap>=0.51.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "langchain-community>=0.4.1",
    "injector>=0.24.0",
    "nanoid>=2.0.0",
    "filelock>=3.13.1",
    "jsonschema>=4.21.0",
    "json-repair>=0.58.7",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "redis>=5.0.3",
    "hiredis>=2.3.2",
    "cachetools>=5.3.0",
    "pybloom-live>=4.0.0",
    "prometheus-client>=0.20.0",
    "apscheduler>=3.10.0",
    "weasyprint>=68.1",
    "markdown>=3.10.2",
    "datasketch>=1.9.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-ollama>=0.1.0",
    "llama-index-llms-openai>=0.2.0",
    "llama-index-llms-anthropic>=0.2.0",
    "llama-index-llms-ollama>=0.2.0",
    "isort>=8.0.1",
    "networkx>=3.6.1",
    "python-louvain>=0.16",
    "openpyxl>=3.1.5",
    "neo4j>=5.0",
]

[project.optional-dependencies]
reranker = [
    "sentence-transformers>=5.3.0",
]

[project.scripts]
start = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "black>=24.2.0",
    "flake8>=7.0.0",
    "hatchling>=1.27.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

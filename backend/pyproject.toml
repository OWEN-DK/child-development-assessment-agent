[project]
name = "child-development-assessment-agent"
version = "0.1.0"
description = "Child Development Assessment Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn>=0.29.0",
    "langgraph==1.1.0",
    "langchain==1.2.11",
    "llama-index==0.14.16",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-vector-stores-pinecone>=0.2.0",
    "llama-index-vector-stores-milvus>=0.2.0",
    "llama-index-vector-stores-weaviate>=0.2.0",
    "pydantic==2.12.5",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.13.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
    "ebooklib>=0.20",
    "html2text>=2025.4.15",
    "pymupdf>=1.27.2",
    "beautifulsoup4>=4.14.3",
    "pytest-asyncio>=1.3.0",
    "llama-index-retrievers-bm25>=0.2.3",
    "llama-index-llms-dashscope>=0.2.1",
    "llama-index-embeddings-dashscope>=0.2.1",
    "jieba>=0.42.1",
    "xgboost>=3.2.0",
    "shap>=0.51.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.5.3",
    "langchain-community>=0.4.1",
    "injector>=0.24.0",
    "sentence-transformers>=5.3.0",
]

[project.scripts]
start = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "black>=24.2.0",
    "flake8>=7.0.0",
    "hatchling>=1.27.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
